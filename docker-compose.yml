version: "3.7"

# Stack do Portainer. CLICKUP_TOKEN é definido nas variáveis de ambiente da stack, nunca aqui.
# Sem login desde 24/11/2026, a pedido: o painel fica aberto para quem tiver o link (sem PAINEL_USER/PAINEL_PASS).
services:
  app:
    image: ghcr.io/palomodigital/palomo-vision:latest
    networks:
      - PalomoRede
    environment:
      PORT: "3000"
      CLICKUP_TOKEN: ${CLICKUP_TOKEN}
      REFRESH_MIN: "5"
      DAYS: "180"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.olhos.rule=Host(`olhos.palomodigital.com.br`)
        - traefik.http.routers.olhos.entrypoints=websecure
        - traefik.http.routers.olhos.tls.certresolver=letsencryptresolver
        - traefik.http.services.olhos.loadbalancer.server.port=3000
        - traefik.http.services.olhos.loadbalancer.passHostHeader=1

networks:
  PalomoRede:
    external: true
    name: PalomoRede
